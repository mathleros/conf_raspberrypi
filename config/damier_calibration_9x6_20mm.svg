<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm" viewBox="0 0 297 210">
  <title>Calibration checkerboard: 9 by 6 internal corners, 20 mm squares</title>
  <desc>A4 landscape. Print at actual size without scaling. The board has
    10 by 7 squares, measures 200 by 140 mm, and has 9 by 6 internal corners.
    Verify the printed square size and the 100 mm reference line.</desc>
  <rect width="297" height="210" fill="white"/>
  <g transform="translate(48.5 35)" fill="black">
    <path d="
      M0 0h20v20h-20z M40 0h20v20h-20z M80 0h20v20h-20z
      M120 0h20v20h-20z M160 0h20v20h-20z
      M20 20h20v20h-20z M60 20h20v20h-20z M100 20h20v20h-20z
      M140 20h20v20h-20z M180 20h20v20h-20z
      M0 40h20v20h-20z M40 40h20v20h-20z M80 40h20v20h-20z
      M120 40h20v20h-20z M160 40h20v20h-20z
      M20 60h20v20h-20z M60 60h20v20h-20z M100 60h20v20h-20z
      M140 60h20v20h-20z M180 60h20v20h-20z
      M0 80h20v20h-20z M40 80h20v20h-20z M80 80h20v20h-20z
      M120 80h20v20h-20z M160 80h20v20h-20z
      M20 100h20v20h-20z M60 100h20v20h-20z M100 100h20v20h-20z
      M140 100h20v20h-20z M180 100h20v20h-20z
      M0 120h20v20h-20z M40 120h20v20h-20z M80 120h20v20h-20z
      M120 120h20v20h-20z M160 120h20v20h-20z"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="black">
    <text x="148.5" y="15" font-size="4">Damier : 10 x 7 cases / 9 x 6 coins interieurs</text>
    <text x="148.5" y="23" font-size="3.5">A4 paysage - Taille reelle / 100 % - Sans ajustement</text>
    <text x="148.5" y="185" font-size="3.5">Case : 20 mm - Damier : 200 x 140 mm - Mesurer apres impression</text>
    <text x="148.5" y="204" font-size="3">Reference : 100 mm</text>
  </g>
  <path d="M98.5 192v6 M98.5 195h100 M198.5 192v6"
        fill="none" stroke="black" stroke-width="0.3"/>
</svg>
