[project]
name = "irobot"
version = "0.1.0"
description = "Banc d'essai matériel Raspberry Pi 5 (caméra, audio, moteur, assistant vocal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.11.0",
    "requests>=2.34.2",
    "vosk>=0.3.45",
    "gpiozero>=2.0.1",
]

[project.scripts]
test = "irobot:main"
camera-live = "irobot.camera.camera_live:main"
balle-rouge = "irobot.camera.balle_rouge:main"
voice-assistant = "irobot.voice_assistant.voice_assistant:main"
smart-car = "irobot.smart_car.smart_car:main"

# Les scripts de test sont désormais dans le dossier tests/ et s'exécutent via
# python3 tests/<nom>.py ; ils ne sont pas exposés via uv run car ils ne font
# pas partie du package installé.

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
