[project]
name = "irobot"
version = "0.1.0"
description = "Banc d'essai matériel Raspberry Pi 5 (caméra, audio, moteur, assistant vocal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.11.0",
    "requests>=2.34.2",
    "gpiozero>=2.0.1; platform_system == 'Linux'",
    "vosk>=0.3.45; platform_system == 'Linux'",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
test = "irobot:main"
camera-live = "irobot.hardware.camera.camera_live:main"
marker-detect-live = "irobot.interfaces.marker_diagnostic:main"
color-detector = "irobot.hardware.camera.color_detector:main"
# Alias conservé pour compatibilité avec l'ancien nom
balle-rouge = "irobot.hardware.camera.color_detector:main"
calibrate-distance = "irobot.hardware.camera.calibrate_distance:main"
voice-assistant = "irobot.hardware.audio.voice_assistant:main"
voice-runtime = "irobot.interfaces.voice_runtime:main"
smart-car = "irobot.hardware.smart_car.smart_car:main"
hc-sr04 = "irobot.hardware.sensors.hc_sr04:main"

# Les scripts de test sont désormais dans le dossier tests/ et s'exécutent via
# python3 tests/<nom>.py ; ils ne sont pas exposés via uv run car ils ne font
# pas partie du package installé.

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
